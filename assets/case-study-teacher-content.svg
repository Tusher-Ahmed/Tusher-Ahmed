<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Teacher Content Delivery</title>
  <desc id="desc">A cross-application commercial feature spanning portals, APIs, permissions, caching, scheduling, and media workflows</desc>
  <defs>
