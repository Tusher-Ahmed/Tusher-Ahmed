  <text x="80" y="56" fill="#A5F3FC" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="750" letter-spacing="1.5">PRIVATE · PROD</text>
  <text x="62" y="106" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="33" font-weight="750">Teacher Content Delivery</text>
  <text x="62" y="140" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="18">One feature carried across portals, APIs, permissions, caching, and media workflows.</text>
  <text x="62" y="190" fill="#C4B5FD" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="650">ASP.NET CORE</text><text x="184" y="190" fill="#475569" font-family="Arial" font-size="14">•</text><text x="207" y="190" fill="#7DD3FC" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="650">CROSS-PORTAL</text><text x="330" y="190" fill="#475569" font-family="Arial" font-size="14">•</text><text x="353" y="190" fill="#A7F3D0" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="650">SCHEDULED PROCESSING</text><text x="532" y="190" fill="#475569" font-family="Arial" font-size="14">•</text><text x="555" y="190" fill="#7DD3FC" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="650">CACHE-AWARE</text>

