    <rect x="72" y="148" width="148" height="52" rx="11" fill="url(#card)" stroke="#34D399" stroke-opacity=".3"/><text x="94" y="179" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="650">Content + Media</text>
