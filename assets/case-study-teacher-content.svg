    <rect x="146" y="0" width="146" height="52" rx="11" fill="url(#card)" stroke="#38BDF8" stroke-opacity=".3"/><text x="170" y="31" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="650">Teacher Portal</text>
