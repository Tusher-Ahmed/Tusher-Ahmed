  <text x="108" y="204" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="750" letter-spacing="-2">Tusher Ahmed</text>
  <text x="112" y="250" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="450">Software Engineer  •  Enterprise .NET  •  Systems Modernization</text>
  <path d="M112 278H760" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

