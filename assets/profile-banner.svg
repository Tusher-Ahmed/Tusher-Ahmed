<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tusher Ahmed — Software Engineer</title>
  <desc id="desc">Animated engineering banner highlighting enterprise .NET, system modernization, APIs, data, caching, and web applications</desc>
  <style>
    .flow { stroke-dasharray: 7 10; animation: flow 5s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
    .pulse-delay { animation-delay: -1.6s; }
    .blink { animation: blink 1.1s steps(2, end) infinite; }
    .shine { animation: shine 7s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -68; } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: .15; } }
    @keyframes shine { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .blink, .shine { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="background" x1="28" y1="16" x2="1170" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1020"/><stop offset=".44" stop-color="#17133B"/><stop offset="1" stop-color="#062B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="74" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".085"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".025"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 60) rotate(45) scale(350 220)">
      <stop stop-color="#7C3AED" stop-opacity=".2"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 175) rotate(135) scale(380 280)">
      <stop stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#FFF" stroke-opacity=".035"/></pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#background)"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="28" fill="url(#violetGlow)"/>
  <rect width="1200" height="380" rx="28" fill="url(#cyanGlow)"/>

  <g transform="translate(74 58)">
    <rect width="218" height="34" rx="17" fill="#A78BFA" fill-opacity=".11" stroke="#A78BFA" stroke-opacity=".3"/>
    <circle class="pulse" cx="20" cy="17" r="5" fill="#34D399"/>
    <text x="36" y="22" fill="#C4B5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="1.7">BUILD · IMPROVE · CONNECT</text>
  </g>

  <text x="74" y="140" fill="#A78BFA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" letter-spacing="4">SOFTWARE ENGINEER</text>
  <text x="70" y="213" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="780" letter-spacing="-2.5">Tusher Ahmed</text>
  <text x="74" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Enterprise .NET  ·  Systems Modernization  ·  Web Engineering</text>

  <g transform="translate(74 291)">
    <text x="0" y="20" fill="#94A3B8" font-family="Consolas,Monaco,monospace" font-size="14">engineering@tusher</text>
    <text x="158" y="20" fill="#64748B" font-family="Consolas,Monaco,monospace" font-size="14">:</text>
    <text x="166" y="20" fill="#67E8F9" font-family="Consolas,Monaco,monospace" font-size="14">~</text>
    <text x="179" y="20" fill="#64748B" font-family="Consolas,Monaco,monospace" font-size="14">$</text>
    <text x="197" y="20" fill="#E2E8F0" font-family="Consolas,Monaco,monospace" font-size="14">build --for-the-long-term</text>
    <rect class="blink" x="421" y="7" width="8" height="16" rx="1" fill="#22D3EE"/>
  </g>
  <path class="shine" d="M74 336H695" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(790 50)">
    <g>
    <rect width="338" height="280" rx="22" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle cx="24" cy="22" r="4" fill="#22D3EE"/><circle cx="41" cy="22" r="4" fill="#A78BFA"/><circle cx="58" cy="22" r="4" fill="#94A3B8"/>
    <text x="84" y="27" fill="#64748B" font-family="Consolas,Monaco,monospace" font-size="11" letter-spacing="1">SYSTEM MAP</text>
    <path d="M22 44H316" stroke="#FFFFFF" stroke-opacity=".1"/>

    <path class="flow" d="M169 139L86 93M169 139L252 93M169 139L86 203M169 139L252 203" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="169" cy="139" r="48" fill="#7C3AED" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".45" stroke-width="2"/>
    <circle class="pulse" cx="169" cy="139" r="56" stroke="#A78BFA" stroke-opacity=".2" stroke-width="2"/>
    <circle cx="169" cy="139" r="35" fill="#13182F" stroke="#C4B5FD" stroke-opacity=".55"/>
    <text x="169" y="146" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750">.NET</text>

    <g transform="translate(46 65)"><rect width="80" height="45" rx="11" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".35"/><text x="40" y="28" text-anchor="middle" fill="#DDD6FE" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700">WEB</text></g>
    <g transform="translate(212 65)"><rect width="80" height="45" rx="11" fill="#38BDF8" fill-opacity=".11" stroke="#38BDF8" stroke-opacity=".35"/><text x="40" y="28" text-anchor="middle" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700">API</text></g>
    <g transform="translate(46 180)"><rect width="80" height="45" rx="11" fill="#8B5CF6" fill-opacity=".12" stroke="#8B5CF6" stroke-opacity=".35"/><text x="40" y="28" text-anchor="middle" fill="#DDD6FE" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700">CACHE</text></g>
    <g transform="translate(212 180)"><rect width="80" height="45" rx="11" fill="#22D3EE" fill-opacity=".11" stroke="#22D3EE" stroke-opacity=".35"/><text x="40" y="28" text-anchor="middle" fill="#A5F3FC" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700">DATA</text></g>

    <circle class="pulse pulse-delay" cx="86" cy="93" r="4" fill="#A78BFA" filter="url(#softGlow)"/>
    <circle class="pulse" cx="252" cy="93" r="4" fill="#38BDF8" filter="url(#softGlow)"/>
    <circle class="pulse" cx="86" cy="203" r="4" fill="#8B5CF6" filter="url(#softGlow)"/>
    <circle class="pulse pulse-delay" cx="252" cy="203" r="4" fill="#22D3EE" filter="url(#softGlow)"/>
      <text x="169" y="258" text-anchor="middle" fill="#64748B" font-family="Consolas,Monaco,monospace" font-size="11" letter-spacing="1.5">DESIGN  →  BUILD  →  EVOLVE</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="378" rx="27" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="2"/>
</svg>
