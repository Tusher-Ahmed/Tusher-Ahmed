<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tusher Ahmed</title>
  <desc id="desc">Software Engineer specializing in enterprise .NET and systems modernization</desc>
  <defs>
    <linearGradient id="background" x1="56" y1="20" x2="1135" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.5" stop-color="#15133C"/>
      <stop offset="1" stop-color="#071B2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="94" x2="930" y2="265" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(955 75) rotate(145) scale(440 260)">
      <stop stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <circle cx="165" cy="35" r="110" fill="#7C3AED" fill-opacity="0.16" filter="url(#blur)"/>
  <circle cx="1080" cy="315" r="120" fill="#0891B2" fill-opacity="0.18" filter="url(#blur)"/>

  <g opacity="0.9">
    <circle cx="1015" cy="78" r="5" fill="#22D3EE"/>
    <circle cx="1050" cy="78" r="5" fill="#A78BFA"/>
    <circle cx="1085" cy="78" r="5" fill="#F8FAFC" fill-opacity="0.7"/>
    <path d="M945 105H1120" stroke="#F8FAFC" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round"/>
    <path d="M945 134H1078" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round"/>
    <path d="M945 157H1118" stroke="#F8FAFC" stroke-opacity="0.16" stroke-width="7" stroke-linecap="round"/>
    <path d="M945 180H1042" stroke="#22D3EE" stroke-opacity="0.42" stroke-width="7" stroke-linecap="round"/>
