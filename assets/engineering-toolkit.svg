    <text x="24" y="113" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">ASP.NET Core MVC</text>
    <text x="24" y="138" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">React · JavaScript · Vite</text>
    <text x="24" y="163" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">Razor · HTML · CSS</text>
