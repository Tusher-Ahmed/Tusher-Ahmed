    <text x="24" y="82" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="21" font-weight="700">Build &amp; collaborate</text>
    <text x="24" y="113" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">Git · GitHub</text>
    <text x="24" y="138" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">Visual Studio · VS Code</text>
    <text x="24" y="163" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">npm · Vite</text>
    <rect x="24" y="185" width="117" height="25" rx="12.5" fill="#22D3EE" fill-opacity=".13"/><text x="40" y="202" fill="#67E8F9" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="650">DAILY TOOLS</text>
  </g>

  <g opacity=".75"><path d="M312 252H337M587 252H612M862 252H887" stroke="url(#accent)" stroke-width="2" stroke-dasharray="5 6"/><circle cx="324.5" cy="252" r="3" fill="#A78BFA"/><circle cx="599.5" cy="252" r="3" fill="#8B5CF6"/><circle cx="874.5" cy="252" r="3" fill="#22D3EE"/></g>
  <text x="600" y="403" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,Arial" font-size="13" letter-spacing="1">DESIGN  →  BUILD  →  SCALE  →  OPERATE</text>
