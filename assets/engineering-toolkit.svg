<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Engineering toolkit</title>
  <desc id="desc">Technologies organized across application, architecture, data, and workflow layers</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="20" x2="1180" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14132F"/><stop offset=".5" stop-color="#101932"/><stop offset="1" stop-color="#072B34"/>
    </linearGradient>
    <linearGradient id="accent" x1="60" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".085"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".025"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#FFF" stroke-opacity=".028"/></pattern>
  </defs>

  <rect width="1200" height="430" rx="24" fill="url(#bg)"/><rect width="1200" height="430" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="428" rx="23" stroke="#FFF" stroke-opacity=".1" stroke-width="2"/>

  <text x="62" y="54" fill="#A78BFA" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2.6">FROM INTERFACE TO INFRASTRUCTURE</text>
  <text x="62" y="92" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="25" font-weight="700">A stack shaped by real production systems</text>
