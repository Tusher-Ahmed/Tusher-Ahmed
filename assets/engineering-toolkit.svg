    <text x="24" y="82" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="21" font-weight="700">Persistence &amp; speed</text>
    <text x="24" y="113" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">SQL Server · PostgreSQL</text>
    <text x="24" y="138" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">Redis · SingleStore</text>
    <text x="24" y="163" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">ClickHouse · NHibernate</text>
